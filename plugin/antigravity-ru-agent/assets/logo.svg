<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>
  <!-- 12.5% outer margin (32px on 256px canvas) for safe rendering on light & dark themes -->
  <rect x="28" y="28" width="200" height="200" rx="44" fill="url(#bgGrad)" stroke="#60A5FA" stroke-width="5"/>
  <!-- Tricolor subtle top accent bar inside badge -->
  <path d="M64 56 H192" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round"/>
  <path d="M64 68 H192" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
  <path d="M64 80 H192" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
  <!-- Orbit ring symbolizing Antigravity -->
  <ellipse cx="128" cy="144" rx="68" ry="24" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="8 6" transform="rotate(-14 128 144)" opacity="0.75"/>
  <!-- Bold RU typography -->
  <text x="128" y="164" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="800" font-size="76" fill="#FFFFFF" letter-spacing="2">RU</text>
  <text x="128" y="204" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700" font-size="18" fill="#93C5FD" letter-spacing="3">ANTIGRAVITY</text>
</svg>
